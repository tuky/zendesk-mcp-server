name: Container

# Exercise the shipped HTTP and Firestore paths whenever source, packaging
# or their smoke-test fixtures change.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsdown.config.ts
      - scripts/bundle-manifest.mjs
      - scripts/container-smoke.mjs
      - scripts/container-firestore-smoke.mjs
      - compose.firestore.yml
      - src/**
      - .github/workflows/container.yml
      - .github/actions/publish-image/**

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zendesk-mcp-server:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: node scripts/container-smoke.mjs zendesk-mcp-server:candidate

      - run: node scripts/container-firestore-smoke.mjs zendesk-mcp-server:candidate
