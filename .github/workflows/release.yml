name: Fork release
on:
  push:
    tags: ['fork-v*']
permissions:
  contents: read
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate versioned tag on main
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT" FETCH_HEAD
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          node --input-type=module - "$COMMIT" "$TAG" <<'NODE'
          import { execFileSync } from 'node:child_process';

          const [commit, tag] = process.argv.slice(2);
          if (!/^fork-v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag ?? '')) {
            throw new Error(`Invalid fork release tag: ${tag}`);
          }
          const packageJson = JSON.parse(
            execFileSync('git', ['show', `${commit}:package.json`], { encoding: 'utf8' }),
          );
          if (tag !== `fork-v${packageJson.version}`) {
            throw new Error(`Tag ${tag} does not match package version ${packageJson.version}`);
          }
          NODE
  publish:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm typecheck && pnpm test && pnpm build
      - run: node scripts/smoke-test.mjs
      - run: pnpm exec vitest run --config vitest.bundle.config.ts
      - run: docker compose -f compose.firestore.yml up -d
      - name: Wait for emulator
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8085 >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pnpm test:firestore
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
      - name: Recheck tag target before publishing
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          remote_commit="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          test "$remote_commit" = "$COMMIT"
      - run: pnpm pack --pack-destination .
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:${TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tag }}
      - run: node scripts/container-smoke.mjs "$IMAGE"
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
      - run: node scripts/container-firestore-smoke.mjs "$IMAGE"
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
      - name: Publish reviewed tag image and source package
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          remote_commit="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          test "$remote_commit" = "$GITHUB_SHA"
          docker push "$IMAGE"
          remote_commit="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          test "$remote_commit" = "$GITHUB_SHA"
          gh release create "$TAG" ./*.tgz --verify-tag --generate-notes
